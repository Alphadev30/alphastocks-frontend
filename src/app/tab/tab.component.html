<div class="left-buttons">
    <button class="button" *ngFor="let tab of tabData; let i = index" [ngClass]="{'active-btn': selectedTab === i}"
        (click)="selectTab(i)">
        Setup {{ i + 1 }}
    </button>

    
    <div class="search-bar">
        <input type="text" placeholder="Search by symbol..." [(ngModel)]="searchTerm" (input)="searchData()" />
    </div>
    
</div>
